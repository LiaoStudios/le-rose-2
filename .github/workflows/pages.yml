name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc && npx vite build --base=/${{ github.event.repository.name }}/
      # Il codice usa percorsi assoluti (/images/..., /#storia): su Pages il sito
      # vive in una sottocartella, quindi li prefissiamo nel risultato finale.
      - name: Percorsi per la sottocartella di Pages
        run: |
          B="/${{ github.event.repository.name }}"
          find dist \( -name '*.js' -o -name '*.html' -o -name '*.css' \) -print0 \
            | xargs -0 perl -pi -e "s#([\"'\`(])/(images|logo|favicon|og-image|\#)#\$1$B/\$2#g"
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
